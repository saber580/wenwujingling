# 文物精灵 —— nginx 站点配置
# 静态文件由 nginx 直接发（HTTP/1.1 + keep-alive + gzip + sendfile）
# 只有 /api/ 转发给本地 Python（127.0.0.1:8000），由它去掉 Origin 去调云端大模型
#
# 部署位置：/etc/nginx/sites-available/relic  → 软链到 sites-enabled
# 生效：nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    listen 8080;
    server_name _;

    root /opt/relic;
    index index.html;

    # 上传体大小（识图接口最多几 MB）
    client_max_body_size 24m;

    # 关掉版本号，少泄露信息
    server_tokens off;

    # ---- 安全响应头（always：404/50x 也带上） ----
    add_header X-Content-Type-Options "nosniff" always;          # 不让浏览器猜 MIME，防脚本被当图片执行
    add_header X-Frame-Options "SAMEORIGIN" always;              # 只允许本站 iframe 嵌套，防点击劫持
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # 外链不泄露站内地址
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;                      # 交给 CSP/现代浏览器，不用老的 XSS 过滤器

    # ---------- 压缩：js/css/html 体积能降 70% 以上 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---------- AI 转发 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 关键：不缓冲，流式内容才能边生成边到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---------- 首页不缓存，改版立即生效 ----------
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---------- 图片/音频/视频：长缓存 + 分段传输 ----------
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|mp3|mp4|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        access_log off;
        # mp4 的 Range 支持由 nginx 自带，浏览器可边下边播
    }

    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    }

    # ---------- 兜底：中文路径、目录 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 日志
    access_log /var/log/nginx/relic.access.log;
    error_log  /var/log/nginx/relic.error.log warn;
}
